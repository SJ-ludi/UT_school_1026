<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>사용성평가 참여 안내</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F5; --panel:#FFFFFF; --ink:#1D2320; --muted:#5D6762; --line:#D7DCD8;
  --main:#0F6B5F; --main-soft:#E2F1EE; --zoom:#2D5BD3; --zoom-soft:#E6ECFB; --warn:#9A5B00; --warn-soft:#FFF4DE;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#161A18; --panel:#1F2421; --ink:#E9EEEB; --muted:#A3ADA8; --line:#38403C;
  --main:#5CC8B6; --main-soft:#1E3631; --zoom:#8FB0FF; --zoom-soft:#1F2A44; --warn:#F2C26B; --warn-soft:#3A2F1A; } }
:root[data-theme="dark"]{ --bg:#161A18; --panel:#1F2421; --ink:#E9EEEB; --muted:#A3ADA8; --line:#38403C;
  --main:#5CC8B6; --main-soft:#1E3631; --zoom:#8FB0FF; --zoom-soft:#1F2A44; --warn:#F2C26B; --warn-soft:#3A2F1A; }
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:17px;line-height:1.55;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--main);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:24px;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 20px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}
.day{flex:0 0 auto;min-width:76px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 12px;cursor:pointer;text-align:center}
.day b{display:block;font-size:18px}
.day span{font-size:14px;color:var(--muted)}
.day[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day[aria-selected="true"] span{color:inherit}
.day.today b::after{content:" 오늘";font-size:12px;font-weight:600;color:var(--main)}
.day[aria-selected="true"].today b::after{color:inherit}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.slot.now{border:2px solid var(--main)}
.slot.past{opacity:.6}
.slot h2{font-size:22px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.tag{font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--main-soft);color:var(--main)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.who{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left}
.who:hover{border-color:var(--ink)}
.who b{display:block;font-size:22px;letter-spacing:1px}
.who span{font-size:14px;color:var(--muted)}
.empty{color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:20px;text-align:center}
.back{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:15px;margin-bottom:18px}
.me{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.me .when{font-size:16px;color:var(--muted);margin:0}
.me .nm{font-size:40px;font-weight:700;letter-spacing:2px;margin:2px 0 6px;line-height:1.2}
.me .ct{margin:0;font-size:16px}
.check{font-size:15px;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 14px;margin:14px 0 0}
.steps{display:grid;gap:12px}
.step{display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:18px 20px;min-height:84px}
.step:hover{border-color:var(--main)}
.step .no{flex:0 0 52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;background:var(--main-soft);color:var(--main)}
.step .tx b{display:block;font-size:22px}
.step .tx span{font-size:15px;color:var(--muted)}
.step.zoom{border-color:var(--zoom);background:var(--zoom-soft)}
.step.zoom .no{background:var(--zoom);color:#fff}
.step[aria-disabled="true"]{opacity:.55;cursor:not-allowed;border-style:dashed}
.guide{background:var(--panel);border:2px solid var(--zoom);border-radius:16px;padding:18px 20px}
.guide .hd{display:flex;align-items:center;gap:16px}
.guide .hd .no{flex:0 0 52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;background:var(--zoom);color:#fff}
.guide .hd b{display:block;font-size:22px}
.guide .hd span{font-size:15px;color:var(--muted)}
.guide ol{margin:14px 0 0;padding:0;list-style:none;counter-reset:g}
.guide li{counter-increment:g;display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line);font-size:16px}
.guide li::before{content:counter(g);flex:0 0 26px;height:26px;border-radius:50%;background:var(--zoom-soft);color:var(--zoom);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.guide li small{display:block;color:var(--muted);font-size:14px}
.kbd{display:inline-block;padding:0 8px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--bg);font-weight:600;font-size:15px;white-space:nowrap}
.kbd.g{background:#1F9D55;color:#fff;border-color:#17803F}
.guide .ok{margin:10px 0 0;background:var(--main-soft);color:var(--main);border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600}
.guide .os{display:block;margin-top:8px;line-height:2}
.guide .os:first-child{margin-top:0}
.guide .os b.t{display:block;line-height:1.5;color:var(--ink)}
.help{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-size:15px}
.help h3{margin:0 0 8px;font-size:16px}
.help ul{margin:0;padding-left:20px}
.help li{margin:4px 0}
.lock{max-width:420px;margin:12vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
.lock h1{font-size:22px}
.lock p{color:var(--muted);margin:6px 0 16px}
.lock form{display:flex;gap:8px}
.lock input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.lock button{border:0;border-radius:10px;padding:10px 16px;background:var(--main);color:#fff;font-weight:700;cursor:pointer}
.lock .err{color:var(--warn);font-size:15px;margin:10px 0 0;min-height:1.4em}
footer{margin-top:28px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between}
@media (max-width:480px){ .me .nm{font-size:34px} .step .tx b{font-size:20px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function md(date){const d=DAYS.find(x=>x[0]===date);return d?d[1]:date}
function isUrl(u){return /^https?:\/\//i.test(String(u||"").trim())}
function foot(){return `<footer><span>KEDI 원격수업 콘텐츠 사용성평가</span><span>${VERSION} · ${UPDATED}</span></footer>`}

/* ---------- 열쇠·복호화 ---------- */
function parseHash(){
  const h=decodeURIComponent(location.hash.replace(/^#/,""));
  const m=h.match(/^k=([^/]+)(?:\/(.*))?$/);
  return m?{key:m[1],id:m[2]||""}:{key:"",id:h};
}
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function unseal(key){
  const raw=b64(SEALED), salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(key),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},k,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
function memo(k){try{if(k)localStorage.setItem("ut_k",k);return localStorage.getItem("ut_k")||""}catch(e){return ""}}
function forget(){try{localStorage.removeItem("ut_k")}catch(e){}}
function go(id){location.hash="k="+encodeURIComponent(KEY)+(id?"/"+id:"")}

function lock(msg){
  app.innerHTML=`<section class="lock"><h1>사용성평가 참여 안내</h1>
  <p>안내 문자로 받은 링크를 눌러서 들어와 주세요. 비밀번호를 알고 있다면 아래에 입력해도 됩니다.</p>
  <form id="lf"><input id="lk" type="password" autocomplete="off" aria-label="비밀번호" placeholder="비밀번호"><button>열기</button></form>
  <p class="err" role="alert">${msg||""}</p></section>${foot()}`;
  document.getElementById("lf").onsubmit=async e=>{e.preventDefault();const v=document.getElementById("lk").value.trim();if(v) await open(v,true)};
}
async function open(key,typed){
  try{
    CFG=await unseal(key); KEY=key; DATA=CFG.data||[]; memo(key);
    const p=parseHash();
    if(!p.key) go(p.id); else route();
    loadLive(); setInterval(loadLive,60000);
    return true;
  }catch(e){
    if(!typed) forget();
    lock(typed?"비밀번호가 맞지 않습니다. 다시 확인해 주세요.":"");
    return false;
  }
}

/* ---------- 화면 ---------- */
function defaultDay(){
  const t=todayStr();
  if(DAYS.some(d=>d[0]===t)) return t;
  if(t<DAYS[0][0]) return DAYS[0][0];
  return DAYS[DAYS.length-1][0];
}
function home(){
  if(!selDay) selDay=defaultDay();
  const t=todayStr(), m=nowMin();
  const tabs=DAYS.map(([d,label,dow])=>{
    const n=DATA.filter(r=>r.date===d).length;
    return `<button class="day ${d===t?"today":""}" role="tab" aria-selected="${d===selDay}" data-d="${d}"><b>${label}</b><span>${dow} · ${n}명</span></button>`;
  }).join("");
  const rows=DATA.filter(r=>r.date===selDay);
  const times=[...new Set(rows.map(r=>r.time))].sort((a,b)=>toMin(a)-toMin(b));
  let body="";
  if(!times.length){ body=`<p class="empty">이 날은 예정된 평가가 없습니다.</p>`; }
  else body=times.map(tm=>{
    const st=toMin(tm), today=selDay===t;
    const now=today && m>=st-20 && m<st+60, past=(selDay<t)||(today && m>=st+60);
    const btns=rows.filter(r=>r.time===tm).map(r=>`<button class="who" data-id="${esc(r.id)}"><b>${esc(r.name)}</b><span>${esc(r.grade)}</span></button>`).join("");
    return `<section class="slot ${now?"now":""} ${past?"past":""}"><h2>${esc(tm)} ${now?'<span class="tag">지금 입장</span>':""}</h2><div class="names">${btns}</div></section>`;
  }).join("");
  app.innerHTML=`<h1>${esc(CFG.title||"사용성평가 참여 안내")}</h1>
  <p class="lead">날짜를 고르고, 시간 아래에서 학생 이름을 누르세요. 이름 가운데 글자는 *로 가렸습니다.</p>
  <div class="days" role="tablist" aria-label="날짜">${tabs}</div>${body}${foot()}`;
  app.querySelectorAll(".day").forEach(b=>b.onclick=()=>{selDay=b.dataset.d;home()});
  const sd=app.querySelector('.day[aria-selected="true"]'); if(sd){const box=sd.parentElement;box.scrollLeft=sd.offsetLeft-box.offsetLeft-8}
  app.querySelectorAll(".who").forEach(b=>b.onclick=()=>go(b.dataset.id));
}
function step(no,title,sub,url,cls){
  return isUrl(url)
    ? `<a class="step ${cls||""}" href="${esc(url)}" target="_blank" rel="noopener noreferrer"><span class="no">${no}</span><span class="tx"><b>${title}</b><span>${sub}</span></span></a>`
    : `<a class="step ${cls||""}" aria-disabled="true"><span class="no">${no}</span><span class="tx"><b>${title}</b><span>링크 준비 중입니다. 시작 전에 다시 열어 주세요.</span></span></a>`;
}
function detail(id){
  const r=DATA.find(x=>x.id===id);
  if(!r){go("");return}
  selDay=r.date;
  app.innerHTML=`<button class="back" id="bk">← 시간표로</button>
  <section class="me">
    <p class="when">${md(r.date)}(${esc(r.dow)}) ${esc(r.time)}</p>
    <p class="nm">${esc(r.name)} <span style="font-size:20px;font-weight:500;letter-spacing:0">${esc(r.grade)}</span></p>
    <p class="ct">${esc(r.subject)} ${esc(r.lesson)}회차 「${esc(r.title)}」</p>
    <p class="check">날짜·시간·이름이 맞는지 확인해 주세요. 다르면 다시 시간표로 돌아가세요.</p>
  </section>
  <div class="steps">
    ${step(1,"강의 보기","진행자가 안내하면 눌러 주세요.",r.content)}
    ${step(2,"사후 설문","강의가 끝나고 진행자가 안내하면 눌러 주세요.",r.post||CFG.post)}
  </div>
  <div class="help"><h3>이렇게 진행돼요 (약 1시간)</h3>
    <ul><li>Zoom에 들어오면 진행자가 인사하고 진행 방법을 알려 드려요. 녹화 안내 창이 뜨면 [확인]을 눌러 주세요.</li>
    <li>강의 보기·사후 설문은 진행자가 안내할 때 하나씩 누르면 됩니다. 버튼을 누르면 새 탭(창)으로 열려요.</li>
    <li>힘들거나 쉬고 싶으면 언제든 말해 주세요. 중간에 그만두어도 괜찮아요.</li>
    <li>버튼이 안 눌리거나 화면이 안 열리면, 안내 문자를 보낸 번호로 연락해 주세요.</li></ul>
  </div>${foot()}`;
  document.getElementById("bk").onclick=()=>go("");
}
function route(keepScroll){
  const p=parseHash();
  if(p.key && p.key!==KEY){ open(p.key,false); return; }
  if(!CFG) return;
  if(p.id && DATA.some(r=>r.id===p.id)) detail(p.id); else home();
  if(!keepScroll) window.scrollTo(0,0);
}

/* ---------- 시트(⑤ 탭 CSV) 실시간 반영: 실패하면 내장 데이터 유지 ---------- */
function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(f);f=""}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f);rows.push(row);row=[];f=""; }
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row)}
  const h=(rows.shift()||[]).map(s=>s.trim());
  return rows.filter(r=>r.some(v=>v.trim()!=="")).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||"").trim()])));
}
let lastSig="";
async function loadLive(){
  if(!CFG||!CFG.csv) return;
  try{
    const res=await fetch(CFG.csv+(CFG.csv.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});
    if(!res.ok) return;
    const rows=parseCSV(await res.text()).filter(r=>r.id&&r.date&&r.time);
    const sig=JSON.stringify(rows);
    if(rows.length && sig!==lastSig){lastSig=sig;DATA=rows;route(true)}
  }catch(e){}
}

window.addEventListener("hashchange",()=>route());
setInterval(()=>{if(CFG&&!parseHash().id)home()},60000);
(async()=>{
  const k=parseHash().key||memo("");
  if(!k){lock("");return}
  await open(k,false);
})();
</script>
